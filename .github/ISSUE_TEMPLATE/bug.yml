name: Bug
description: Defect with reproducible evidence
title: "[BUG] "
body:
  - type: input
    id: project
    attributes:
      label: PROJECT_ID
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: [Critical, High, Medium, Low]
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
  - type: textarea
    id: current
    attributes:
      label: Current Behaviour
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction Steps
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
  - type: input
    id: component
    attributes:
      label: Suspected Component
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
  - type: textarea
    id: regression
    attributes:
      label: Regression Test
